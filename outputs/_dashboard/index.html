<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Outputs 离线作品库</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#/" aria-label="返回首页">
          <span class="brand-mark">✦</span>
          <span>
            <strong>Outputs</strong>
            <small>离线作品库</small>
          </span>
        </a>

        <div class="search-box">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="搜索作品、文件、代码…" autocomplete="off" />
        </div>

        <nav class="nav-section nav-section--categories" aria-label="内容分类">
          <p>内容分类</p>
          <div id="categoryNav"></div>
        </nav>

        <nav class="nav-section nav-section--projects" aria-label="项目导航">
          <p>项目</p>
          <div id="projectNav" class="project-nav"></div>
        </nav>

        <div class="sidebar-foot">
          <span class="status-dot"></span>
          <span id="scanStatus">正在扫描…</span>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn mobile-only" id="menuBtn" aria-label="打开导航">☰</button>
          <div class="breadcrumbs" id="breadcrumbs"></div>
          <div class="top-actions">
            <label class="switch">
              <input type="checkbox" id="autoRefresh" checked />
              <span>自动同步</span>
            </label>
            <button class="ghost-btn" id="refreshBtn">↻ 刷新</button>
          </div>
        </header>
        <div id="content" class="content" aria-live="polite"></div>
      </main>
    </div>

    <div class="lightbox" id="lightbox" hidden>
      <button class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
      <button class="lightbox-nav prev" id="lightboxPrev" aria-label="上一张">‹</button>
      <img id="lightboxImage" alt="" />
      <button class="lightbox-nav next" id="lightboxNext" aria-label="下一张">›</button>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script src="/app.js" defer></script>
  </body>
</html>
