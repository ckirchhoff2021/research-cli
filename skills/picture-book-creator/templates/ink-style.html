<!-- picture-book skill · 绘本 HTML 模板（已在《大明王朝1566》水墨风验证）
     用法：替换 {} 占位内容；章节可复制 <section> 块；图片放 images/ 相对目录。
     换风格：修改 :root 里的变量组即可整体换美术主题，下方提供 3 套预设可取消注释覆盖。
     注意：.seal（印章）、.wisdom 标签文字、中文数字章节号属水墨结构元素，
           换非中国风风格时建议同步调整对应 HTML/CSS。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{书名} · {副标题}（{美术风格}绘本）</title>
<style>
  :root{
    /* ======== 风格变量（改这组换美术主题） ======== */
    --paper:#f5f0e6;            /* 页面底色 */
    --ink:#2b2b2b;              /* 正文色 */
    --ink-light:#5a5a52;        /* 次要文字 */
    --accent:#b03a2e;           /* 强调色（印章/章节号/表头重点） */
    --accent2:#8a6d3b;          /* 辅助色（哲思标题/prompt 链接） */
    --card-bg:#fbf8f1;          /* 插图卡/表格底色 */
    --card-border:#e0d6c2;      /* 插图卡/表格边框 */
    --wisdom-bg:#efe7d6;        /* 哲思块底色 */
    --wisdom-text:#4a4030;      /* 哲思块文字 */
    --caption-muted:#8a8070;    /* 图注弱化色 */
    --table-head-bg:#3a3a34;    /* 表头底色 */
    --table-head-text:#f5f0e6;  /* 表头文字 */
    --stripe-bg:#f3ecdd;        /* 表格斑马纹 */
    --texture-dot:#e8e0d0;      /* 纸张纹理点（设为 transparent 可关闭纹理） */
    --font-main:"Songti SC","Noto Serif SC","STSong",serif;
  }

  /* ======== 预设风格（取消对应注释覆盖上方 :root） ========
  ── 工笔重彩 ──
  :root{
    --paper:#faf3e8; --ink:#3a2e2a; --ink-light:#6b5d52;
    --accent:#c0392b; --accent2:#b8860b;
    --card-bg:#fdf8f0; --card-border:#e2d5c0;
    --wisdom-bg:#f5ead8; --wisdom-text:#5a4a38;
    --caption-muted:#9a8b78; --table-head-bg:#4a3828; --table-head-text:#faf3e8;
    --stripe-bg:#f5ecdc; --texture-dot:#efe4d0;
    --font-main:"Kaiti SC","STKaiti","Noto Serif SC",serif;
  }
  ── 电影写实（暗色） ──
  :root{
    --paper:#1a1a1e; --ink:#e8e6e3; --ink-light:#a09c94;
    --accent:#d4a574; --accent2:#8fa8bf;
    --card-bg:#242428; --card-border:#3a3a40;
    --wisdom-bg:#2a2a30; --wisdom-text:#c8c4bc;
    --caption-muted:#787470; --table-head-bg:#34343a; --table-head-text:#e8e6e3;
    --stripe-bg:#202024; --texture-dot:transparent;
    --font-main:"PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;
  }
  ── 黑白版画 ──
  :root{
    --paper:#f0f0ee; --ink:#1a1a1a; --ink-light:#555;
    --accent:#333; --accent2:#666;
    --card-bg:#fafafa; --card-border:#ccc;
    --wisdom-bg:#e8e8e6; --wisdom-text:#333;
    --caption-muted:#888; --table-head-bg:#1a1a1a; --table-head-text:#f0f0ee;
    --stripe-bg:#e4e4e2; --texture-dot:transparent;
    --font-main:"Songti SC","Noto Serif SC",serif;
  }
  ======================================================== */

  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-main);
    line-height:1.9;
    background-image:radial-gradient(var(--texture-dot) 1px, transparent 1px);
    background-size:28px 28px;
  }
  .book{max-width:820px;margin:0 auto;padding:48px 28px 96px}

  /* ---- 封面 ---- */
  .cover{text-align:center;padding:96px 0 72px;border-bottom:3px double var(--ink-light)}
  .cover .dynasty{letter-spacing:14px;color:var(--ink-light);font-size:15px;margin-bottom:18px}
  .cover h1{font-size:52px;letter-spacing:6px;margin-bottom:10px}
  .cover h2{font-size:22px;font-weight:normal;color:var(--ink-light);letter-spacing:4px}
  .cover .seal{
    display:inline-block;margin:26px auto 0;padding:8px 14px;
    border:2px solid var(--accent);color:var(--accent);
    font-size:16px;letter-spacing:3px;border-radius:4px;
    transform:rotate(-3deg);
  }
  .cover .meta{margin-top:30px;font-size:13px;color:var(--ink-light);letter-spacing:1px}

  /* ---- 章节 ---- */
  section{margin:64px 0;page-break-inside:avoid}
  .chap-no{
    font-size:14px;color:var(--accent);letter-spacing:6px;margin-bottom:6px;
  }
  section h3{
    font-size:26px;letter-spacing:2px;margin-bottom:22px;
    padding-bottom:10px;border-bottom:1px solid var(--card-border);
  }
  section p{margin-bottom:16px;text-align:justify}
  section p strong{color:var(--accent)}

  /* ---- 哲思块 ---- */
  .wisdom{
    margin:24px 0;padding:18px 22px;
    background:var(--wisdom-bg);border-left:4px solid var(--accent2);
    border-radius:0 6px 6px 0;font-size:15px;color:var(--wisdom-text);
  }
  .wisdom::before{content:"◈ 哲思";display:block;color:var(--accent2);font-size:13px;letter-spacing:3px;margin-bottom:8px}

  /* ---- 插图卡 ---- */
  figure.ill{margin:34px 0;background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  figure.ill .frame{line-height:0}
  figure.ill .frame img{width:100%;height:auto;display:block}
  figure.ill figcaption{padding:12px 18px;font-size:14px;color:var(--ink-light);display:flex;gap:10px;align-items:baseline}
  figure.ill figcaption .no{color:var(--accent);font-size:13px;letter-spacing:1px;white-space:nowrap}
  figure.ill details{padding:0 18px 14px}
  figure.ill details summary{cursor:pointer;font-size:13px;color:var(--accent2)}
  figure.ill details p{font-size:12.5px;color:var(--caption-muted);margin-top:8px;line-height:1.7}

  /* ---- 表格（结局对照表等） ---- */
  table{width:100%;border-collapse:collapse;margin:26px 0;font-size:14px;background:var(--card-bg)}
  th{background:var(--table-head-bg);color:var(--table-head-text);padding:10px 12px;text-align:left;letter-spacing:1px}
  td{padding:9px 12px;border-bottom:1px solid var(--card-border);vertical-align:top}
  tr:nth-child(even) td{background:var(--stripe-bg)}

  /* ---- 版权 ---- */
  .colophon{text-align:center;margin-top:90px;padding-top:30px;border-top:3px double var(--ink-light);font-size:13px;color:var(--ink-light);letter-spacing:1px}

  @media print{
    body{background:#fff;background-image:none}
    section{page-break-before:always}
  }
</style>
</head>
<body>
<div class="book">

<!-- ============ 封面 ============ -->
<div class="cover">
  <div class="dynasty">{时代/领域 大字}</div>
  <h1>{书名}</h1>
  <h2>{副标题}</h2>
  <div class="seal">{核心主题印章}</div>
  <div class="meta">{作者/来源信息}<br>{美术风格}绘本 · seedream 插图 {N} 幅</div>
</div>

<!-- ============ 章节（可复制） ============ -->
<section>
  <div class="chap-no">壹</div>
  <h3>序章 · {标题}</h3>
  <p>{正文段落……}</p>
  <div class="wisdom">{把内容影射到现实的哲思。}</div>
  <figure class="ill">
    <div class="frame"><img src="images/01-cover.jpg" alt="插图01 · {图名}"></div>
    <figcaption><span class="no">插图01</span><span>{画面描述} —— {象征意义}</span></figcaption>
    <details><summary>查看 prompt</summary><p>{该图的完整 prompt，便于复现}</p></details>
  </figure>
</section>

<!-- ============ 终章对照表示例 ============ -->
<section>
  <div class="chap-no">终</div>
  <h3>终章 · {核心问题}</h3>
  <table>
    <tr><th>人物</th><th>性格底色</th><th>行为方式</th><th>结局</th></tr>
    <tr><td>{人物}</td><td>{性格}</td><td>{行为}</td><td>{结局}</td></tr>
  </table>
</section>

<div class="colophon">
  插图共 {N} 幅，由 seedream 按{美术风格} prompt 生成<br>
  {制作说明 / 日期}
</div>

</div>
</body>
</html>
