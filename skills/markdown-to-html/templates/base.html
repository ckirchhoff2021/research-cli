<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        {{ css|safe }}
    </style>
    {{ math_js|safe }}
</head>
<body class="style-{{ style }}">
    <div class="container">
        <header class="document-header">
            <h1 class="document-title">{{ title }}</h1>
            {% if author or date %}
            <div class="document-meta">
                {% if author %}<span class="author">作者：{{ author }}</span>{% endif %}
                {% if date %}<span class="date">{{ date }}</span>{% endif %}
            </div>
            {% endif %}
        </header>

        {% if toc %}
        <nav class="toc-nav">
            <div class="toc-title">目录</div>
            {{ toc|safe }}
        </nav>
        {% endif %}

        <main class="document-content">
            {% block content %}
            {{ content|safe }}
            {% endblock %}
        </main>

        <footer class="document-footer">
            <p>由 markdown-to-html 工具生成</p>
        </footer>
    </div>
</body>
</html>
